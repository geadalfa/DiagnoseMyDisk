name: DiagnoseMyDisk
options:
  bundleIdPrefix: com.geadalfa
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    ARCHS: arm64
    CODE_SIGN_STYLE: Automatic
    COMBINE_HIDPI_IMAGES: YES
targets:
  DiagnoseMyDisk:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geadalfa.DiagnoseMyDisk
        INFOPLIST_KEY_CFBundleDisplayName: DiagnoseMyDisk
        INFOPLIST_KEY_CFBundleName: DiagnoseMyDisk
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Geadalfa Giyanda. CC BY-NC 4.0."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Resources/App.entitlements
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.3.5"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: YES
  DiagnoseMyDiskTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: DiagnoseMyDisk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geadalfa.DiagnoseMyDiskTests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: YES
