name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          brew install xcodegen create-dmg

      - name: Run Anti-Slop Audit & Build DMG
        run: |
          cd macos
          bash scripts/build-dmg.sh . "DiagnoseMyDisk"

      - name: Run Automated Tests
        run: |
          cd macos
          xcodegen generate
          xcodebuild test -project DiagnoseMyDisk.xcodeproj -scheme DiagnoseMyDisk -destination "platform=macOS,arch=arm64"

      - name: Upload DMG to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            macos/build/DiagnoseMyDisk.dmg
            releases/DiagnoseMyDisk.dmg

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Standalone Bundle
        run: |
          pyinstaller -y --clean DiagnoseMyDisk.spec

      - name: Compile Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
        shell: powershell

      - name: Package Portable ZIP
        run: |
          Compress-Archive -Path dist\DiagnoseMyDisk\* -DestinationPath installer_output\DiagnoseMyDisk-portable.zip
        shell: powershell

      - name: Upload Windows Assets to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            installer_output/*_Setup.exe
            installer_output/*-portable.zip
