    <text x="120" y="90" text-anchor="middle" fill="#FAFAFA" font-family="Consolas, monospace" font-size="38" font-weight="800">86%</text>
    <text x="120" y="116" text-anchor="middle" fill="#71717A" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">TRUE HEALTH</text>
    <text x="120" y="140" text-anchor="middle" fill="#F59E0B" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">FIRMWARE MASK DETECTED</text>

