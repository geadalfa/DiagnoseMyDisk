<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">DiagnoseMyDisk — evidence-based storage diagnostics for Windows</title>
  <desc id="desc">Dark banner with product name, offline privacy badge, and feature chips for True Health, S.M.A.R.T forensics, surface LBA map, and safe cleanup.</desc>
  <rect width="1200" height="320" fill="#09090B"/>
  <g stroke="#27272A" stroke-width="1" opacity="0.7">
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200"/>
    <path d="M120 0 V320 M240 0 V320 M360 0 V320 M480 0 V320 M600 0 V320 M720 0 V320 M840 0 V320 M960 0 V320 M1080 0 V320"/>
  </g>
  <rect x="0" y="0" width="8" height="320" fill="#2563EB"/>
