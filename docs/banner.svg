    <text x="64" y="132" fill="#FAFAFA" font-size="52" font-weight="800" letter-spacing="-1.5">Diagnose<tspan fill="#60A5FA">MyDisk</tspan></text>
    <text x="66" y="174" fill="#A1A1AA" font-size="18" font-weight="500">Evidence-based storage diagnostics. No telemetry. No fabricated numbers.</text>

